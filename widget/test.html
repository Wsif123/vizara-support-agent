<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vizara Support — Widget Test</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f0f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); text-align: center; max-width: 500px; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #333; }
    p { color: #666; font-size: 14px; line-height: 1.6; }
    .badge { display: inline-block; margin-top: 20px; padding: 6px 16px; background: #6C63FF; color: #fff; border-radius: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Vizara Studio</h1>
    <p>This page is a test harness for the support widget. Click the chat bubble at the bottom-right to open the support agent.</p>
    <div class="badge">Widget loaded</div>
  </div>
  <script src="chat-widget.js"></script>
</body>
</html>
