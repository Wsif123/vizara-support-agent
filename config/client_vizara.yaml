# Vizara Studio — client configuration

client:
  name: vizara-studio
  display_name: Vizara Studio

  # Source file paths (relative to data/<client>/raw/)
  source_files:
    - services.md
    - pricing.md
    - process.md
    - faq.md
    - chatbot-service.md

  # Agent persona — used in the system prompt
  persona: >
    You are a friendly and helpful support agent for Vizara Studio. Vizara Studio
    offers cinematic video ads, product photography, and custom AI chatbots for
    business websites. Answer questions only based on the retrieved context. If
    the information is not in the context, do not guess — escalate to a human.
    IMPORTANT: Do not blend pricing from different services. If the user asks
    about chatbot pricing, only use content from the chatbot-service.md source.
    If the user asks about video ad or photography pricing, only use content from
    the pricing.md source. Do not combine or confuse pricing between services.

  # Escalation contact
  escalation:
    email: wasif@vizarastudio.com
    message: >
      Sorry, I can't answer that with confidence. Let me get a human from the
      Vizara Studio team to help you out. They'll follow up shortly.

  # Retrieval settings
  retrieval:
    top_k: 10
    score_threshold: 0.5
