# Vizara Studio — client configuration

client:
  name: vizara-studio
  display_name: Vizara Studio
  domain: vizarastudioo.netlify.app
  enabled: true

  # Source file paths (relative to data/<client>/raw/)
  source_files:
    - services.md
    - pricing.md
    - process.md
    - faq.md
    - chatbot-service.md

  # Agent persona — used in the system prompt
  persona: >
    You are a friendly and helpful support agent for Vizara Studio. Vizara Studio
    offers cinematic video ads, product photography, and custom AI chatbots for
    business websites. Answer questions only based on the retrieved context. If
    the information is not in the context, do not guess — escalate to a human.

  # Tenant-specific prompt rules
  prompt_rules: |
    ## CRITICAL: Do not blend pricing across services
    - Each service has its own separate pricing structure. Never combine or confuse pricing from different services.
    - Chatbot pricing is only in chatbot-service.md. Video ad and photography pricing are only in pricing.md.
    - If answering about chatbot pricing, only use content explicitly tagged with source chatbot-service.md.
    - If answering about video ad or photography pricing, only use content explicitly tagged with source pricing.md.

  # Escalation contact
  escalation:
    email: wasif@vizarastudio.com
    contact_name: Wasif
    sla_text: "within ~1 hour"
    message: >
      Sorry, I can't answer that with confidence. Let me get a human from the
      Vizara Studio team to help you out. They'll follow up shortly.

  # Retrieval settings
  retrieval:
    top_k: 8
    score_threshold: 0.5
